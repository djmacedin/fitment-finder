<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitment Finder</title><style>body{font-family:system-ui;background:#f3f6fa;color:#14243b;margin:0}header{background:#102a4c;color:white;padding:24px 18px}main{max-width:760px;margin:auto;padding:18px}.panel{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #0001}select,input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0 15px;border:1px solid #c5cedb;border-radius:10px;font-size:16px}button{background:#1565c0;color:white;border:0;font-weight:700}label{font-weight:600}.muted{color:#586a7c}.warning{background:#fff4d5;padding:12px;border-radius:10px}h1{margin:0}ul{padding-left:20px}</style></head><body><header><h1>Fitment Finder</h1><p>UK wheel and tyre reference • Prototype v1</p></header><main><section class="panel"><h2>Choose your vehicle</h2><label>Make<select id="make"></select></label><label>Model<select id="model"></select></label><label>Generation<select id="generation"></select></label><button id="find">Find specifications</button></section><section id="result" class="panel" hidden></section><section class="panel"><h2>Reverse wheel search</h2><label>Bolt pattern (PCD)<select id="pcd"></select></label><label>Minimum centre bore (mm)<input id="bore" type="number" min="0" step="0.1" placeholder="e.g. 57.1"></label><button id="reverse">Find candidate vehicles</button><div id="matches"></div><p class="muted">Matches are only initial candidates. Brake clearance, offset, width, load, fasteners and tyre specifications must be checked.</p></section></main><script src="data.js"></script><script>
const $=id=>document.getElementById(id);const unique=a=>[...new Set(a)];const option=(s,a)=>{s.innerHTML='';a.forEach(v=>s.add(new Option(v,v)))};const records=window.FITMENT_RECORDS;
function makes(){option($('make'),unique(records.map(r=>r.make)).sort());models()}function models(){option($('model'),unique(records.filter(r=>r.make===$('make').value).map(r=>r.model)));generations()}function generations(){option($('generation'),records.filter(r=>r.make===$('make').value&&r.model===$('model').value).map(r=>r.generation))}function item(s){return `<li>${s}</li>`}function show(){const r=records.find(r=>r.make===$('make').value&&r.model===$('model').value&&r.generation===$('generation').value);if(!r)return;$('result').hidden=false;$('result').innerHTML=`<h2>${r.make} ${r.model} ${r.generation}</h2><p>${r.years}</p><h3>Wheel fitment</h3><p><b>PCD:</b> ${r.pcd}<br><b>Centre bore:</b> ${r.centre_bore_mm} mm<br><b>Fasteners:</b> ${r.fastener}</p><h3>Common OEM wheel examples</h3><ul>${r.common_oem_wheels.map(item).join('')}</ul><h3>Common OEM tyre examples</h3><ul>${r.common_oem_tyres.map(item).join('')}</ul><p class="warning"><b>Starter reference — not verified for your exact car.</b> ${r.notes} Check manufacturer documentation, VIN/trim and brake clearance before buying or fitting.</p>`;$('result').scrollIntoView({behavior:'smooth'})}function reverse(){let p=$('pcd').value,b=Number($('bore').value);let matches=records.filter(r=>r.pcd===p&&(!b||r.centre_bore_mm<=b));$('matches').innerHTML=`<h3>${matches.length} candidate vehicle configurations</h3><ul>${matches.map(r=>item(`${r.make} ${r.model} ${r.generation} — centre bore ${r.centre_bore_mm} mm`)).join('')}</ul>`} $('make').addEventListener('change',models);$('model').addEventListener('change',generations);$('find').addEventListener('click',show);$('reverse').addEventListener('click',reverse);option($('pcd'),unique(records.map(r=>r.pcd)).sort());makes();
</script></body></html>
